<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
  <title>EcoHuella</title>
</head>

<body>
  <header class="encabezado">
    <div class="bienvenida-container">
      <h1>Bienvenido</h1>
      <p>Aquí aprenderá sobre contaminación</p>
    </div>
  </header>

  <main class="centro">
    <!-- Contenedor general para las tarjetas -->
    <div class="tarjetas-contenedor">
      
      <!-- Opción 1: Calculadora (Toda la tarjeta es un enlace) -->
      <a href="/calculadora" class="card">
        <img src="/static/img/_calculadora_-removebg-preview.png" alt="draw_calculadora">
        <span>Eco-Calculadora</span>
      </a>

      <!-- Opción 2: Teoría -->
      <a href="/teoria" class="card">
        <img src="/static/img/img_to_teory_in_final_proyect-removebg-preview.png" alt="book">
        <span>Leer teoría</span>
      </a>

      <!-- Opción 3: Pánico -->
      <a href="/panico" class="card">
        <img src="/static/img/img_to_panico_in_final_proyect-removebg-preview.png" alt="SOS">
        <span>Botón de emergencia</span>
      </a>

    </div>

    <!-- Imagen del árbol -->
    <section class="trees">
      <img src="/static/img/arbol_de_la_pagina_base.png" alt="arbol">
    </section>
  </main>

  <footer class="footer">
    <h4>Actualmente hay ≈3 billones de arboles</h4>
  </footer>
</body>
