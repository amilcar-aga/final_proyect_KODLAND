<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/calculadora.css">
  <title>eco-calculadora</title>
</head>

<!--configuración del body-->
<body>
  <h1>🧮 Calculadora de huella de carbono</h1>

  <form method="POST" action= "/calculo" class="formulario">
    <label>¿tenes auto?
      <select name="auto">
        <option value="si">Sí</option>
        <option value="no">No</option>
        <option value="si_electrico">sí, es electrico</option>
      </select>
    </label>
    <label> Kilómetros en auto por semana
      <input type="number" name="km_auto" min="0" step="1" value="0" required>
    </label>
    <label> Vuelos por año
      <input type="number" name="vuelos" min="0" step="1" value="0" required>
    </label>
    <label>promedio de km por vuelo
      <input type="number" name="km_vuelos" min = "0" step = "1" value = "0" required>
    </label>
    <label>¿Reciclas?
      <select name="reciclaje" required>
        <option value="si">Sí</option>
        <option value="a_veces">A veces</option>
        <option value="no">No</option>
      </select>
    </label>
    <label>¿tenes arboles?
      <select name="arbol" required>
        <option value="si">sí</option>
        <option value="no">no</option>
        <option value="plantas">tengo otras plantas</option>
      </select>
    </label>
    <label>¿cuantos arboles tienes?
      <input type="number" name="N_arboles" min = "0" step="1" value="0" required>
    </label>
    <label>¿Qué tan seguido te bañas?
      <select name="duchas" required>
        <option value="+1duchaXdia">más de una vez al día</option>
        <option value="duchaXdia">una ves al día</option>
        <option value="ducha_dia/2">una día por medio</option>
        <option value="duchaXsemana">al menos una ducha por semana</option>
      </select>
    </label>
  <button type="submit" class="btn">Calcular</button>
  </form>
</body>
</html>
